name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Slim install only — the ML extras are optional at runtime.
      - name: Install
        run: pip install -e ".[dev]"

      # A committed provider key is the one mistake that cannot be undone by a
      # later deploy, so it fails the build before anything else runs.
      - name: Secret scan
        run: python scripts/check_secrets.py --all

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      # tsc -b plus the production bundle: the check Render/Vercel deploys rely on.
      - name: Build
        run: npm run build
