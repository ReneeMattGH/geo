[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geotrade"
version = "0.2.0"
requires-python = ">=3.11"
# Core runtime only. Heavy ML/NLP and broker SDKs live in the extras below; every
# one of them is imported lazily behind try/except ImportError, so the API boots
# and serves without them. Keeping them out of the default install is what makes
# the deployment image small enough to build on a modest host.
dependencies = [
    # Web
    "fastapi==0.141.1",
    "starlette==1.9.0",
    "uvicorn[standard]==0.30.1",
    "httpx[http2]==0.27.0",
    "slowapi==0.1.9",
    "websockets==15.0.1",
    "python-multipart==0.0.9",

    # Data validation
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "email-validator==2.3.0",

    # DB
    "sqlalchemy[asyncio]==2.1.5",
    "asyncpg==0.32.0",
    "greenlet==3.5.6",
    "alembic==1.20.0",
    "psycopg2-binary==2.9.13",

    # Cache / Queue
    "redis[hiredis]==6.4.0",
    "celery[redis]==5.6.3",
    "msgpack==1.2.3",

    # Numerics + light ML (no torch required)
    "numpy==2.4.6",
    "pandas==3.0.6",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "hdbscan==0.8.44",
    "vaderSentiment==3.3.2",
    "rapidfuzz==3.14.6",

    # Market data / ingestion
    "yfinance==1.7.0",
    "feedparser==6.0.11",
    "lxml==6.1.3",
    "python-dateutil==2.9.0.post0",
    "tenacity==8.3.0",
    "supabase==2.33.0",

    # Observability
    "structlog==26.1.0",
    "opentelemetry-sdk==1.25.0",
    "opentelemetry-instrumentation-fastapi==0.46b0",
    "opentelemetry-exporter-otlp==1.25.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3.0",
    "transformers==5.20.1",
    "sentence-transformers>=3.0.0",
    "spacy>=3.7.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
]
brokers = [
    "alpaca-trade-api>=3.0.0",
    "oandapyV20>=0.7.2",
    "ib-insync>=0.9.85",
]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-timeout==2.3.1",
    "anyio==4.4.0",
    "aiosqlite==0.20.0",
    "ruff==0.4.9",
]
# Test suite that exercises the NLP/ML paths. Keep it out of `dev` so CI and a
# fresh clone install the slim tree: `pip install -e ".[dev,ml]"` opts in.
dev-ml = [
    "geotrade[ml]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# The gate targets mistakes that break the running app: syntax errors, undefined
# or shadowed names, unused imports, and obvious correctness bugs. Style-only
# families (import order, pep8-naming, pyupgrade) are deliberately left off —
# the codebase predates them and mass-rewriting 1300 annotations would bury real
# fixes in noise. Enable them incrementally as files are touched.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E402",  # providers import config/asset lists after module bootstrap
    "B008",  # FastAPI reads Depends() in argument defaults by design
    "B905",  # zip() without strict= across optional-length provider payloads
    "F841",  # unused locals are intermediate aliases kept for readability
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules re-export names for public APIs.
"__init__.py" = ["F401"]
"app/models/*.py" = ["F401"]
"app/schemas/*.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60
addopts = "--tb=short -v"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]
